name: SV_TRENDS
description: '{"description": "Daily book trend of predicted time-to-fill and fill-probability over open orders. Powers the AI-Advisor Time-to-fill and Fill-probability trend cards / KpiStrip sparklines: query DIMENSIONS=[SNAPSHOT_DATE] with the AVG metrics to get the daily book average series. Filter ORDER_ROLE for the order_purpose (hiring) default. Ported from looker-staffing-predictive time_and_probability_trend. Always filter CLIENT_ID.", "label": "Trends"}'
tables:
  - name: TRENDS
    base_table:
      database: "{{ database }}"
      schema: "{{ schema }}"
      table: TRENDS_DAILY
    primary_key:
      columns: [ROW_ID]
    dimensions:
      - name: CLIENT_ID
        synonyms: [client, customer]
        description: '{"description": "Client id. REQUIRED filter on every query.", "label": "Client ID"}'
        expr: TRENDS.CLIENT_ID
        data_type: VARCHAR(16777216)
      - name: SNAPSHOT_DATE
        synonyms: [date, day, event date]
        description: '{"description": "Snapshot day. Group by this for the trend series.", "label": "Date"}'
        expr: TRENDS.SNAPSHOT_DATE
        data_type: DATE
      - name: ORDER_ROLE
        synonyms: [role, purpose]
        description: '{"description": "Order role. Filter to placement/likely_placement for the hiring order_purpose default.", "label": "Order Role"}'
        expr: TRENDS.ORDER_ROLE
        data_type: VARCHAR(16777216)
    facts:
      - name: TIME_TO_FILL
        synonyms: [time to fill, ttf]
        description: '{"description": "Per-order predicted time to fill (days).", "hidden": true, "label": "Time To Fill"}'
        expr: TRENDS.TIME_TO_FILL
        data_type: FLOAT
        access_modifier: public_access
      - name: FILL_PROBABILITY
        synonyms: [fill probability]
        description: '{"description": "Per-order predicted fill probability (0-1).", "hidden": true, "label": "Fill Probability"}'
        expr: TRENDS.FILL_PROBABILITY
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: AVG_TIME_TO_FILL
        synonyms: [avg time to fill, avg ttf]
        description: '{"description": "Book-average predicted time to fill (days) for the day.", "label": "Avg Time To Fill"}'
        expr: AVG(TRENDS.TIME_TO_FILL)
        access_modifier: public_access
      - name: AVG_FILL_PROBABILITY
        synonyms: [avg fill probability]
        description: '{"description": "Book-average predicted fill probability for the day.", "label": "Avg Fill Probability"}'
        expr: AVG(TRENDS.FILL_PROBABILITY)
        access_modifier: public_access
      - name: ACTIVE_ORDERS
        synonyms: [active orders, order count]
        description: '{"description": "Distinct open orders on the day.", "label": "Active Orders"}'
        expr: COUNT(DISTINCT TRENDS.ORDER_ID)
        access_modifier: public_access
