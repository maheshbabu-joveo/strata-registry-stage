# Native Snowflake semantic view — a minimal working sample. Edit it, or add more
# views in this folder. It reads the sample base view at ../base/ai_advisor_test_overview_base.sql.
name: SV_AI_ADVISOR_TEST_OVERVIEW
description: "AI Advisor Test"

tables:
  - name: overview
    base_table:
      database: "{{ database }}"   # env target (STRATA_DEV / STRATA_PREVIEW / STRATA)
      schema: "{{ schema }}"
      table: AI_ADVISOR_TEST_OVERVIEW_BASE
    primary_key:
      columns: [CLIENT_ID, EVENT_DATE]
    dimensions:
      - name: CATEGORY
        expr: CATEGORY
        data_type: VARCHAR
    metrics:
      - name: TOTAL_AMOUNT
        expr: SUM(AMOUNT)
        data_type: NUMBER
